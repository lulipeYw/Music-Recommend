<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicDiscovery - 음악 추천 및 차트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .text-ellipsis-custom {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <div class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- 좌측: 최근 추천받은 음악 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 md:col-span-1 flex flex-col h-[780px]">
      <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
        <i class="fa-regular font-normal fa-clock text-gray-500"></i> 최근 추천받은 음악
      </h2>
      <div id="recentList" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
        <!-- JS 렌더링 -->
      </div>
    </div>

    <!-- 중앙: 메인 영역 -->
    <div class="md:col-span-2 space-y-4">
      <!-- 헤더 -->
      <div class="text-center py-2">
        <h1 class="text-2xl font-black tracking-tight text-gray-900 flex items-center justify-center gap-2">
          <i class="fa-brands fa-apple text-3xl"></i> MusicDiscovery
        </h1>
        <p class="text-xs text-gray-400 mt-1">실시간 인기 차트 및 무드별 추천 서비스</p>
      </div>

      <!-- 카테고리 / 차트 선택 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-3 font-medium">카테고리 / 차트 선택</div>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="selectCategory('kor')" id="btn-kor" class="cat-btn bg-red-500 text-white p-3 rounded-xl font-bold text-xs shadow-md hover:opacity-90 transition relative overflow-hidden h-16 flex flex-col justify-between">
            <span>한국 TOP 100</span>
            <i class="fa-solid fa-compact-disc absolute bottom-2 right-2 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('usa')" id="btn-usa" class="cat-btn bg-blue-600 text-white p-3 rounded-xl font-bold text-xs shadow-md hover:opacity-90 transition relative overflow-hidden h-16 flex flex-col justify-between">
            <span>미국 TOP 100</span>
            <i class="fa-solid fa-flag-usa absolute bottom-2 right-2 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('chill')" id="btn-chill" class="cat-btn bg-emerald-500 text-white p-3 rounded-xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-16 flex flex-col justify-between">
            <span>휴식 / 드라이브</span>
            <i class="fa-solid fa-leaf absolute bottom-2 right-2 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('focus')" id="btn-focus" class="cat-btn bg-indigo-600 text-white p-3 rounded-xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-16 flex flex-col justify-between">
            <span>몰입 / OST</span>
            <i class="fa-solid fa-headphones absolute bottom-2 right-2 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('energy')" id="btn-energy" class="cat-btn bg-amber-500 text-white p-3 rounded-xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-16 flex flex-col justify-between">
            <span>에너지 / 영화</span>
            <i class="fa-solid fa-fire absolute bottom-2 right-2 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('emotional')" id="btn-emotional" class="cat-btn bg-purple-600 text-white p-3 rounded-xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-16 flex flex-col justify-between">
            <span>감성 / 애니</span>
            <i class="fa-solid fa-moon absolute bottom-2 right-2 text-white/30 text-2xl"></i>
          </button>
        </div>

        <button onclick="getRandomTrack()" class="w-full mt-4 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl text-sm transition shadow-md active:scale-98">
          오늘의 추천곡 받기
        </button>
      </div>

      <!-- 메인 추천 카드 (고정 높이 및 앨범 이미지 적용) -->
      <div id="mainCard" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between h-[300px]">
        <div>
          <div class="flex gap-4 items-center">
            <img id="mainTrackImg" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80" class="w-20 h-20 rounded-xl object-cover shadow-md border border-gray-100 flex-shrink-0" alt="Album Art">
            <div class="flex-1 min-w-0">
              <h3 id="mainTrackTitle" class="text-base font-bold text-gray-900 line-clamp-1 h-6 leading-6">노래를 선택해 주세요</h3>
              <p id="mainArtistName" class="text-xs text-gray-500 mt-1 line-clamp-1 h-5 leading-5">아티스트 정보</p>
            </div>
          </div>
          <!-- 설명 박스 높이 고정 -->
          <div class="mt-4 p-3 bg-gray-50 rounded-xl border border-gray-100 h-16 flex items-center">
            <p id="mainTrackDesc" class="text-xs text-gray-600 line-clamp-2 leading-relaxed">
              위 카테고리 버튼을 누르거나 '오늘의 추천곡 받기'를 클릭해 보세요.
            </p>
          </div>
        </div>

        <div class="flex gap-3 mt-4">
          <button onclick="toggleFavoriteCurrent()" id="favBtn" class="flex-1 border border-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-1.5">
            <i class="fa-regular fa-heart"></i> 보관함 저장
          </button>
          <a id="appleMusicLink" href="#" target="_blank" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-brands fa-apple"></i> Apple Music 듣기
          </a>
        </div>
      </div>

      <!-- 유사한 느낌의 추천곡 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-2 font-medium">비슷한 느낌의 추천곡</div>
        <div id="similarTracks" class="grid grid-cols-3 gap-2">
          <!-- JS 렌더링 -->
        </div>
      </div>
    </div>

    <!-- 우측: 내 보관함 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 md:col-span-1 flex flex-col h-[780px]">
      <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-1.5">
        <i class="fa-solid fa-heart text-red-500"></i> 내 보관함
      </h2>
      <div id="favoritesList" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
        <!-- JS 렌더링 -->
      </div>
    </div>

  </div>

  <script>
    // 카테고리 데이터 세트 (실제 앨범 아트 검색 가능한 정확한 이름들)
    const localDatabase = {
      chill: [
        { title: "Off My Face", artist: "Justin Bieber", desc: "잔잔한 어쿠스틱 기타와 감성적인 목소리가 어우러진 휴식곡." },
        { title: "Peaches", artist: "Justin Bieber", desc: "드라이브하며 들기 딱 좋은 세련되고 감각적인 R&B 트랙." },
        { title: "Sunday Morning", artist: "Maroon 5", desc: "편안한 여유를 선사하는 클래식 감성ポップ." },
        { title: "Paris in the Rain", artist: "Lauv", desc: "비 오는 날이나 차 안에서 듣기 좋은 감성적인 팝." },
        { title: "comethru", artist: "Jeremy Zucker", desc: "솔직하고 담백한 가사와 멜로디의 힐링 송." }
      ],
      focus: [
        { title: "One Summer's Day", artist: "Joe Hisaishi", desc: "센과 치히로의 행방불명 메인 테마곡. 최고 수준의 몰입감." },
        { title: "Merry-Go-Round of Life", artist: "Joe Hisaishi", desc: "하울의 움직이는 성 OST. 웅장하고 아름다운 피아노 선율." },
        { title: "Time", artist: "Hans Zimmer", desc: "인셉션 OST. 깊은 집중과 몰입을 유도하는 거장의 명곡." },
        { title: "River Flows in You", artist: "Yiruma", desc: "마음을 차분하게 가라앉혀주는 섬세한 피아노 스튜디오 트랙." },
        { title: "Experience", artist: "Ludovico Einaudi", desc: "점진적으로 고조되는 클래식 바이올린 피아노 선율." }
      ],
      energy: [
        { title: "Uptown Funk", artist: "Mark Ronson", desc: "어디서나 기분을 업시켜주는 리드미컬하고 신나는 디스코 펑크." },
        { title: "Can't Stop the Feeling!", artist: "Justin Timberlake", desc: "밝은 에너지와 활력을 불어넣는 트롤 OST." },
        { title: "Believer", artist: "Imagine Dragons", desc: "강렬한 비트와 에너지가 넘쳐나는 드럼 록 사운드." },
        { title: "Bang Bang", artist: "Jessie J, Ariana Grande, Nicki Minaj", desc: "폭발적인 가창력과 신나는 파워풀 트랙." },
        { title: "Counting Stars", artist: "OneRepublic", desc: "중독성 강한 멜로디와 함께 뛰놀 수 있는 대표 곡." }
      ],
      emotional: [
        { title: "Sparkle", artist: "RADWIMPS", desc: "너의 이름은 OST. 서정적이고 거대한 감동을 주는 곡." },
        { title: "Nantes", artist: "Beirut", desc: "아날로그 감성을 자극하는 독특하고 아름다운 아코디언 음색." },
        { title: "Fix You", artist: "Coldplay", desc: "지친 마음을 따뜻하게 위로하는 콜드플레이의 대표 명곡." },
        { title: "Event Horizon", artist: "YOASOBI", desc: "감성적인 멜로디와 서사가 돋보이는 팝 트랙." },
        { title: "All of Me", artist: "John Legend", desc: "진심 어린 감정을 전달하는 감 감동적인 발라드." }
      ]
    };

    let currentTrack = null;
    let currentCategoryList = [];
    let recentTracks = JSON.parse(localStorage.getItem('recentTracks')) || [];
    let favoriteTracks = JSON.parse(localStorage.getItem('favoriteTracks')) || [];

    // iTunes Search API로 실제 앨범 아트 및 정보 동적 로드
    async function fetchAlbumArt(title, artist) {
      try {
        const query = encodeURIComponent(`${title} ${artist}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const track = data.results[0];
            const artwork = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '600x600bb') : null;
            return {
              artworkUrl: artwork || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
              appleMusicUrl: track.trackViewUrl || `https://music.apple.com/kr/search?term=${query}`
            };
          }
        }
      } catch (e) {
        console.error("Album Art Fetch Failed", e);
      }
      return {
        artworkUrl: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
        appleMusicUrl: `https://music.apple.com/kr/search?term=${encodeURIComponent(title + ' ' + artist)}`
      };
    }

    // 카테고리 선택
    async function selectCategory(cat) {
      let tracks = [];
      if (cat === 'kor' || cat === 'usa') {
        const store = cat === 'kor' ? 'kr' : 'us';
        try {
          const res = await fetch(`https://itunes.apple.com/${store}/rss/topsongs/limit=20/json`);
          const data = await res.json();
          const entries = data.feed.entry || [];
          tracks = entries.map(item => ({
            title: item['im:name'].label,
            artist: item['im:artist'].label,
            img: item['im:image'][2].label.replace('170x170', '600x600'),
            link: item.id.label,
            desc: `${cat === 'kor' ? '한국' : '미국'} 실시간 인기 차트 TOP 20 트랙입니다.`
          }));
        } catch (e) {
          console.warn("RSS Fetch failed, loading fallback", e);
          tracks = localDatabase['chill'];
        }
      } else {
        tracks = localDatabase[cat] || localDatabase['chill'];
      }

      currentCategoryList = tracks;
      const firstTrack = tracks[0];
      await displayTrack(firstTrack);
    }

    // 무작위 추천
    async function getRandomTrack() {
      if (!currentCategoryList || currentCategoryList.length === 0) {
        await selectCategory('chill');
      }
      const randomIndex = Math.floor(Math.random() * currentCategoryList.length);
      await displayTrack(currentCategoryList[randomIndex]);
    }

    // 트랙 표시
    async function displayTrack(trackObj) {
      let artworkUrl = trackObj.img;
      let musicUrl = trackObj.link;

      // 이미지가 없는 경우 iTunes Search로 보완
      if (!artworkUrl) {
        const fetched = await fetchAlbumArt(trackObj.title, trackObj.artist);
        artworkUrl = fetched.artworkUrl;
        musicUrl = fetched.appleMusicUrl;
      }

      currentTrack = {
        title: trackObj.title,
        artist: trackObj.artist,
        img: artworkUrl,
        link: musicUrl || `https://music.apple.com/kr/search?term=${encodeURIComponent(trackObj.title + ' ' + trackObj.artist)}`,
        desc: trackObj.desc || `${trackObj.artist}의 대표 명곡입니다.`
      };

      // UI 반영
      document.getElementById('mainTrackTitle').innerText = currentTrack.title;
      document.getElementById('mainArtistName').innerText = currentTrack.artist;
      document.getElementById('mainTrackDesc').innerText = currentTrack.desc;
      document.getElementById('mainTrackImg').src = currentTrack.img;
      document.getElementById('appleMusicLink').href = currentTrack.link;

      updateFavButtonState();
      addToRecent(currentTrack);
      renderSimilarTracks();
    }

    // 최근 들은 음악 추가
    function addToRecent(track) {
      recentTracks = recentTracks.filter(t => !(t.title === track.title && t.artist === track.artist));
      recentTracks.unshift(track);
      if (recentTracks.length > 15) recentTracks.pop();
      localStorage.setItem('recentTracks', JSON.stringify(recentTracks));
      renderRecent();
    }

    // 최근 음악 목록 렌더링
    function renderRecent() {
      const el = document.getElementById('recentList');
      el.innerHTML = recentTracks.map(t => `
        <div onclick='displayTrack(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="flex items-center gap-3 p-2 hover:bg-gray-50 rounded-xl cursor-pointer transition">
          <img src="${t.img}" class="w-10 h-10 rounded-lg object-cover flex-shrink-0" alt="art">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold text-gray-800 text-ellipsis-custom">${t.title}</div>
            <div class="text-[11px] text-gray-400 text-ellipsis-custom">${t.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 보관함 토글
    function toggleFavoriteCurrent() {
      if (!currentTrack) return;
      const existsIndex = favoriteTracks.findIndex(t => t.title === currentTrack.title && t.artist === currentTrack.artist);
      if (existsIndex > -1) {
        favoriteTracks.splice(existsIndex, 1);
      } else {
        favoriteTracks.unshift(currentTrack);
      }
      localStorage.setItem('favoriteTracks', JSON.stringify(favoriteTracks));
      updateFavButtonState();
      renderFavorites();
    }

    function updateFavButtonState() {
      const btn = document.getElementById('favBtn');
      if (!currentTrack) return;
      const isFav = favoriteTracks.some(t => t.title === currentTrack.title && t.artist === currentTrack.artist);
      if (isFav) {
        btn.innerHTML = `<i class="fa-solid fa-heart text-red-500"></i> 보관함 해제`;
        btn.classList.add('bg-red-50', 'border-red-200');
      } else {
        btn.innerHTML = `<i class="fa-regular fa-heart"></i> 보관함 저장`;
        btn.classList.remove('bg-red-50', 'border-red-200');
      }
    }

    // 보관함 렌더링
    function renderFavorites() {
      const el = document.getElementById('favoritesList');
      if (favoriteTracks.length === 0) {
        el.innerHTML = `<div class="text-xs text-gray-400 text-center py-8">보관된 음악이 없습니다.</div>`;
        return;
      }
      el.innerHTML = favoriteTracks.map(t => `
        <div onclick='displayTrack(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="flex items-center gap-3 p-2 hover:bg-gray-50 rounded-xl cursor-pointer transition">
          <img src="${t.img}" class="w-10 h-10 rounded-lg object-cover flex-shrink-0" alt="art">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold text-gray-800 text-ellipsis-custom">${t.title}</div>
            <div class="text-[11px] text-gray-400 text-ellipsis-custom">${t.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 유사 추천곡 렌더링
    function renderSimilarTracks() {
      const el = document.getElementById('similarTracks');
      if (!currentCategoryList || currentCategoryList.length <= 1) {
        el.innerHTML = '';
        return;
      }
      const filtered = currentCategoryList.filter(t => t.title !== currentTrack.title).slice(0, 3);
      el.innerHTML = filtered.map(t => `
        <div onclick='displayTrack(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="p-2 border border-gray-100 rounded-xl hover:bg-gray-50 cursor-pointer transition flex flex-col items-center text-center">
          <img src="${t.img || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80'}" class="w-12 h-12 rounded-lg object-cover mb-1.5" alt="art">
          <div class="text-[11px] font-bold text-gray-800 text-ellipsis-custom w-full">${t.title}</div>
          <div class="text-[10px] text-gray-400 text-ellipsis-custom w-full">${t.artist}</div>
        </div>
      `).join('');
    }

    // 초기화
    window.addEventListener('DOMContentLoaded', () => {
      renderRecent();
      renderFavorites();
      selectCategory('kor');
    });
  </script>
</body>
</html>
