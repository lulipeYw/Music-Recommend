<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicDiscovery - 음악 추천 및 차트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .text-ellipsis-custom {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] text-gray-800 min-h-screen">

  <div class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- 좌측: 최근 추천받은 음악 -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 md:col-span-1 flex flex-col h-[760px]">
      <h2 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
        <i class="fa-regular fa-clock text-gray-400"></i> 최근 추천받은 음악
      </h2>
      <div id="recentList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 custom-scrollbar">
        <!-- JS 렌더링 -->
      </div>
    </div>

    <!-- 중앙: 메인 영역 -->
    <div class="md:col-span-2 space-y-5">
      <!-- 헤더 -->
      <div class="text-center py-2">
        <h1 class="text-2xl font-black tracking-tight text-gray-900 flex items-center justify-center gap-2">
          <i class="fa-brands fa-apple text-3xl"></i> MusicDiscovery
        </h1>
        <p class="text-xs text-gray-400 mt-1">실시간 인기 차트 및 무드별 추천 서비스</p>
      </div>

      <!-- 카테고리 / 차트 선택 -->
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-3 font-medium">카테고리 / 차트 선택</div>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="selectCategory('kor')" id="btn-kor" class="cat-btn bg-rose-500 text-white p-3.5 rounded-2xl font-bold text-xs shadow-sm hover:opacity-90 transition relative overflow-hidden h-20 flex flex-col justify-between text-left">
            <span>한국 TOP 100</span>
            <i class="fa-solid fa-compact-disc absolute bottom-2.5 right-2.5 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('usa')" id="btn-usa" class="cat-btn bg-blue-600 text-white p-3.5 rounded-2xl font-bold text-xs shadow-sm hover:opacity-90 transition relative overflow-hidden h-20 flex flex-col justify-between text-left">
            <span>미국 TOP 100</span>
            <i class="fa-solid fa-flag-usa absolute bottom-2.5 right-2.5 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('chill')" id="btn-chill" class="cat-btn bg-emerald-500 text-white p-3.5 rounded-2xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-20 flex flex-col justify-between text-left">
            <span>휴식 / 드라이브</span>
            <i class="fa-solid fa-leaf absolute bottom-2.5 right-2.5 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('focus')" id="btn-focus" class="cat-btn bg-indigo-600 text-white p-3.5 rounded-2xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-20 flex flex-col justify-between text-left">
            <span>몰입 / OST</span>
            <i class="fa-solid fa-headphones absolute bottom-2.5 right-2.5 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('energy')" id="btn-energy" class="cat-btn bg-amber-500 text-white p-3.5 rounded-2xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-20 flex flex-col justify-between text-left">
            <span>에너지 / 영화</span>
            <i class="fa-solid fa-fire absolute bottom-2.5 right-2.5 text-white/30 text-2xl"></i>
          </button>
          <button onclick="selectCategory('emotional')" id="btn-emotional" class="cat-btn bg-purple-600 text-white p-3.5 rounded-2xl font-bold text-xs hover:opacity-90 transition relative overflow-hidden h-20 flex flex-col justify-between text-left">
            <span>감성 / 애니</span>
            <i class="fa-solid fa-moon absolute bottom-2.5 right-2.5 text-white/30 text-2xl"></i>
          </button>
        </div>

        <button onclick="getRandomTrack()" class="w-full mt-4 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-2xl text-sm transition shadow-sm active:scale-[0.99]">
          오늘의 추천곡 받기
        </button>
      </div>

      <!-- 메인 추천 카드 (높이 고정) -->
      <div id="mainCard" class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-between h-[310px]">
        <div>
          <div class="flex gap-4 items-center">
            <img id="mainTrackImg" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80" class="w-20 h-20 rounded-2xl object-cover shadow-sm border border-gray-100 flex-shrink-0" alt="Album Art">
            <div class="flex-1 min-w-0">
              <h3 id="mainTrackTitle" class="text-base font-bold text-gray-900 line-clamp-1 h-6 leading-6">노래를 선택해 주세요</h3>
              <p id="mainArtistName" class="text-xs text-gray-400 mt-1 line-clamp-1 h-5 leading-5">아티스트 정보</p>
            </div>
          </div>
          <!-- 설명 박스 높이 엄격 고정 -->
          <div class="mt-4 p-3.5 bg-gray-50 rounded-2xl border border-gray-100/80 h-[68px] flex items-center">
            <p id="mainTrackDesc" class="text-xs text-gray-500 line-clamp-2 leading-relaxed">
              위 카테고리 버튼을 누르거나 '오늘의 추천곡 받기'를 클릭해 보세요.
            </p>
          </div>
        </div>

        <div class="flex gap-3 mt-4">
          <button onclick="toggleFavoriteCurrent()" id="favBtn" class="flex-1 border border-gray-200 text-gray-700 py-3 rounded-2xl text-xs font-bold hover:bg-gray-50 transition flex items-center justify-center gap-1.5">
            <i class="fa-regular fa-heart"></i> 보관함 저장
          </button>
          <a id="appleMusicLink" href="#" target="_blank" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-2xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-brands fa-apple"></i> Apple Music 듣기
          </a>
        </div>
      </div>

      <!-- 비슷 한 느낌의 추천곡 -->
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-3 font-medium">비슷한 느낌의 추천곡</div>
        <div id="similarTracks" class="grid grid-cols-3 gap-3">
          <!-- JS 렌더링 -->
        </div>
      </div>
    </div>

    <!-- 우측: 내 보관함 -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 md:col-span-1 flex flex-col h-[760px]">
      <h2 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-1.5">
        <i class="fa-solid fa-heart text-rose-500"></i> 내 보관함
      </h2>
      <div id="favoritesList" class="flex-1 overflow-y-auto space-y-2.5 pr-1 custom-scrollbar">
        <!-- JS 렌더링 -->
      </div>
    </div>

  </div>

  <script>
    // 카테고리 고유 데이터베이스 (원래 이미지 링크 보존)
    const localDatabase = {
      kor: [
        { title: "Whiplash", artist: "aespa", img: "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/bf/2d/87/bf2d87e0-4966-3d77-d464-d62f4e4e94bb/cover_aespa_Whiplash.jpg/600x600bb.jpg", desc: "실시간 KR 인기 차트! 세련되고 압도적인 중독성의 팝 댄스." },
        { title: "How Sweet", artist: "NewJeans", img: "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/5a/2a/bc/5a2abc22-7f9a-e877-380d-bc015f8d380e/cover_HowSweet.jpg/600x600bb.jpg", desc: "통통 튀는 바이브와 뉴진스만의 감성이 돋보이는 힙합 스타일 트랙." },
        { title: "Supernova", artist: "aespa", img: "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/80/7e/45/807e452a-9e1d-4eb4-4443-bd2177ff8d0b/cover_aespa_Supernova.jpg/600x600bb.jpg", desc: "내적 댄스를 유발하는 에스파의 대표 히트곡." },
        { title: "한 페이지가 될 수 있게", artist: "DAY6 (데이식스)", img: "https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/28/e1/50/28e150db-3b68-7616-5629-9e0c5108034a/cover_DAY6.jpg/600x600bb.jpg", desc: "청량하고 에너지 넘치는 밴드 사운드의 대표 명곡." },
        { title: "Love wins all", artist: "아이유", img: "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/2b/9b/df/2b9bdfa8-7d84-df91-d8a4-0c5a2bc71cb2/cover_IU_Lovewinsall.jpg/600x600bb.jpg", desc: "웅장한 발라드 사운드와 진한 감동을 선사하는 트랙." },
        { title: "Spot! (feat. JENNIE)", artist: "지코 (ZICO)", img: "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/8a/0f/36/8a0f3689-d41c-3bbf-463d-0d6d5ef0a5d4/cover_ZICO_SPOT.jpg/600x600bb.jpg", desc: "늦은 밤 두 친구의 솔직한 순간을 담은 신나는 힙합 트랙." },
        { title: "예뻤어", artist: "DAY6 (데이식스)", img: "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/7c/ef/a0/7cefa089-0d12-1430-8d5c-3f2d29bf7049/cover_EveryDAY6.jpg/600x600bb.jpg", desc: "아련한 추억을 자극하는 감성적인 록 발라드." },
        { title: "Small girl (feat. 도경수)", artist: "이영지", img: "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/4e/c5/d1/4ec5d1b7-a829-1602-53b7-7eef2c2c06bf/cover_SmallGirl.jpg/600x600bb.jpg", desc: "귀엽고 달콤한 멜로디와 어쿠스틱 사운드의 조화." }
      ],
      usa: [
        { title: "Love Never Felt So Good", artist: "Michael Jackson", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&auto=format&fit=crop&q=80", desc: "팝의 황제 마이클 잭슨의 디스코 팝 명곡." },
        { title: "Kaibutsu", artist: "YOASOBI", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80", desc: "질주감 넘치는 비트와 스릴 있는 보컬." },
        { title: "Treasure", artist: "Bruno Mars", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop&q=80", desc: "레트로 펑크와 브루노 마스의 흥겨운 감성." },
        { title: "Beat It", artist: "Michael Jackson", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&auto=format&fit=crop&q=80", desc: "강렬한 기타 리프와 파워풀한 록 팝." },
        { title: "Runaway Baby", artist: "Bruno Mars", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop&q=80", desc: "화려한 브라스와 속도감 있는 신나는 트랙." }
      ],
      chill: [
        { title: "Off My Face", artist: "Justin Bieber", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80", desc: "어쿠스틱 기타와 함께하는 감성적인 휴식곡." },
        { title: "Peaches", artist: "Justin Bieber", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop&q=80", desc: "드라이브하며 듣기 좋은 세련된 R&B 트랙." },
        { title: "Sunday Morning", artist: "Maroon 5", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&auto=format&fit=crop&q=80", desc: "편안한 여유를 선물하는 미디엄 템포 팝." }
      ],
      focus: [
        { title: "One Summer's Day", artist: "Joe Hisaishi", img: "https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=600&auto=format&fit=crop&q=80", desc: "센과 치히로의 행방불명 메인 테마 피아노 곡." },
        { title: "Merry-Go-Round of Life", artist: "Joe Hisaishi", img: "https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=600&auto=format&fit=crop&q=80", desc: "하울의 움직이는 성 대표 오케스트라 트랙." }
      ],
      energy: [
        { title: "Uptown Funk", artist: "Mark Ronson", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop&q=80", desc: "에너지가 솟구치는 리드미컬 펑크." },
        { title: "Can't Stop the Feeling!", artist: "Justin Timberlake", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&auto=format&fit=crop&q=80", desc: "기분을 업시켜주는 신나는 디스코 팝." }
      ],
      emotional: [
        { title: "Sparkle", artist: "RADWIMPS", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80", desc: "너의 이름은 OST 서정적이고 거대한 록 사운드." },
        { title: "Fix You", artist: "Coldplay", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop&q=80", desc: "지친 마음을 따스하게 감싸주는 명곡." }
      ]
    };

    let currentTrack = null;
    let currentCategoryList = [];
    let recentTracks = JSON.parse(localStorage.getItem('recentTracks')) || [];
    let favoriteTracks = JSON.parse(localStorage.getItem('favoriteTracks')) || [];

    // 카테고리 선택
    async function selectCategory(cat) {
      let tracks = localDatabase[cat] || localDatabase['chill'];

      // 온라인 RSS 데이터 시도 (실패 시 안전하게 localDatabase 사용)
      if (cat === 'kor' || cat === 'usa') {
        const store = cat === 'kor' ? 'kr' : 'us';
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);
          const res = await fetch(`https://itunes.apple.com/${store}/rss/topsongs/limit=15/json`, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data.feed && data.feed.entry) {
              const apiTracks = data.feed.entry.map(item => ({
                title: item['im:name'].label,
                artist: item['im:artist'].label,
                img: item['im:image'][2].label.replace('170x170', '600x600'),
                link: item.id.label,
                desc: `${cat === 'kor' ? '한국' : '미국'} 실시간 인기 차트 곡입니다.`
              }));
              if (apiTracks.length > 0) tracks = apiTracks;
            }
          }
        } catch (e) {
          console.log("RSS 로딩 타임아웃/실패로 기존 차트 데이터 사용");
        }
      }

      currentCategoryList = tracks;
      displayTrack(tracks[0]);
    }

    // 무작위 추천
    function getRandomTrack() {
      if (!currentCategoryList || currentCategoryList.length === 0) {
        selectCategory('chill');
        return;
      }
      const randomIndex = Math.floor(Math.random() * currentCategoryList.length);
      displayTrack(currentCategoryList[randomIndex]);
    }

    // 트랙 표시
    function displayTrack(trackObj) {
      if (!trackObj) return;

      currentTrack = {
        title: trackObj.title,
        artist: trackObj.artist,
        img: trackObj.img || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
        link: trackObj.link || `https://music.apple.com/kr/search?term=${encodeURIComponent(trackObj.title + ' ' + trackObj.artist)}`,
        desc: trackObj.desc || `${trackObj.artist}의 감성적인 수록곡입니다.`
      };

      // UI 요소에 바인딩
      document.getElementById('mainTrackTitle').innerText = currentTrack.title;
      document.getElementById('mainArtistName').innerText = currentTrack.artist;
      document.getElementById('mainTrackDesc').innerText = currentTrack.desc;
      document.getElementById('mainTrackImg').src = currentTrack.img;
      document.getElementById('appleMusicLink').href = currentTrack.link;

      updateFavButtonState();
      addToRecent(currentTrack);
      renderSimilarTracks();
    }

    // 최근 추천곡 추가
    function addToRecent(track) {
      recentTracks = recentTracks.filter(t => !(t.title === track.title && t.artist === track.artist));
      recentTracks.unshift(track);
      if (recentTracks.length > 20) recentTracks.pop();
      localStorage.setItem('recentTracks', JSON.stringify(recentTracks));
      renderRecent();
    }

    // 최근 추천 목록 렌더링 (높이 및 레이아웃 유지)
    function renderRecent() {
      const el = document.getElementById('recentList');
      if (recentTracks.length === 0) {
        el.innerHTML = `<div class="text-xs text-gray-400 text-center py-8">추천받은 내역이 없습니다.</div>`;
        return;
      }
      el.innerHTML = recentTracks.map(t => `
        <div onclick='displayTrack(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="flex items-center gap-3 p-2 hover:bg-gray-50 rounded-2xl cursor-pointer transition">
          <img src="${t.img}" class="w-10 h-10 rounded-xl object-cover flex-shrink-0 shadow-sm border border-gray-100" alt="art">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold text-gray-800 text-ellipsis-custom">${t.title}</div>
            <div class="text-[11px] text-gray-400 text-ellipsis-custom">${t.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 보관함 토글
    function toggleFavoriteCurrent() {
      if (!currentTrack) return;
      const existsIndex = favoriteTracks.findIndex(t => t.title === currentTrack.title && t.artist === currentTrack.artist);
      if (existsIndex > -1) {
        favoriteTracks.splice(existsIndex, 1);
      } else {
        favoriteTracks.unshift(currentTrack);
      }
      localStorage.setItem('favoriteTracks', JSON.stringify(favoriteTracks));
      updateFavButtonState();
      renderFavorites();
    }

    function updateFavButtonState() {
      const btn = document.getElementById('favBtn');
      if (!currentTrack) return;
      const isFav = favoriteTracks.some(t => t.title === currentTrack.title && t.artist === currentTrack.artist);
      if (isFav) {
        btn.innerHTML = `<i class="fa-solid fa-heart text-rose-500"></i> 보관함 해제`;
        btn.classList.add('bg-rose-50', 'border-rose-200');
      } else {
        btn.innerHTML = `<i class="fa-regular fa-heart"></i> 보관함 저장`;
        btn.classList.remove('bg-rose-50', 'border-rose-200');
      }
    }

    // 보관함 렌더링
    function renderFavorites() {
      const el = document.getElementById('favoritesList');
      if (favoriteTracks.length === 0) {
        el.innerHTML = `<div class="text-xs text-gray-400 text-center py-8">보관함이 비어있습니다.</div>`;
        return;
      }
      el.innerHTML = favoriteTracks.map(t => `
        <div onclick='displayTrack(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="flex items-center gap-3 p-2 hover:bg-gray-50 rounded-2xl cursor-pointer transition">
          <img src="${t.img}" class="w-10 h-10 rounded-xl object-cover flex-shrink-0 shadow-sm border border-gray-100" alt="art">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold text-gray-800 text-ellipsis-custom">${t.title}</div>
            <div class="text-[11px] text-gray-400 text-ellipsis-custom">${t.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 비슷 한 느낌 추천곡 렌더링 (높이 및 레이아웃 유지)
    function renderSimilarTracks() {
      const el = document.getElementById('similarTracks');
      if (!currentCategoryList || currentCategoryList.length <= 1) {
        el.innerHTML = '';
        return;
      }
      const filtered = currentCategoryList.filter(t => t.title !== currentTrack.title).slice(0, 3);
      el.innerHTML = filtered.map(t => `
        <div onclick='displayTrack(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="p-2 border border-gray-100 rounded-2xl hover:bg-gray-50 cursor-pointer transition flex items-center gap-2.5">
          <img src="${t.img}" class="w-9 h-9 rounded-xl object-cover flex-shrink-0 border border-gray-100" alt="art">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold text-gray-800 text-ellipsis-custom">${t.title}</div>
            <div class="text-[10px] text-gray-400 text-ellipsis-custom">${t.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 페이지 진입 초기화
    window.addEventListener('DOMContentLoaded', () => {
      renderRecent();
      renderFavorites();
      selectCategory('kor');
    });
  </script>
</body>
</html>
