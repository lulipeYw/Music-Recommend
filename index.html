<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicDiscovery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f7;
      margin: 0;
      padding: 20px;
      color: #1c1c1e;
    }
    .app-container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 24px;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .header p {
      font-size: 13px;
      color: #8e8e93;
      margin: 0;
    }
    .search-box {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      border-radius: 14px;
      border: 1px solid #e5e5ea;
      background-color: #f2f2f7;
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 18px;
    }
    .search-box:focus {
      background-color: #ffffff;
      border-color: #007aff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
    }
    .section-title {
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .cat-btn {
      border: none;
      border-radius: 14px;
      padding: 18px 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease, opacity 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .cat-btn:active { transform: scale(0.96); }
    .cat-ost { background: linear-gradient(135deg, #ff3b30, #ff6b60); }
    .cat-jpop { background: linear-gradient(135deg, #8e44ad, #a29bfe); }
    .cat-jazz { background: linear-gradient(135deg, #d35400, #e67e22); }
    .cat-rest { background: linear-gradient(135deg, #2ecc71, #55efc4); }
    .cat-pop { background: linear-gradient(135deg, #2980b9, #74b9ff); }
    .cat-kpop { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }

    .music-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      border: 1px solid #e5e5ea;
      border-radius: 16px;
      padding: 16px;
      background: #fafafa;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1c1c1e;
      margin: 0 0 4px 0;
    }
    .card-artist {
      font-size: 13px;
      color: #007aff;
      font-weight: 600;
    }
    .card-tag {
      font-size: 11px;
      background: #e5e5ea;
      color: #636366;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .card-desc {
      font-size: 13px;
      color: #3a3a3c;
      line-height: 1.5;
      margin: 8px 0;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #f0f0f0;
    }
    .card-tracks {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 6px;
    }
    .no-result {
      text-align: center;
      padding: 40px 0;
      color: #8e8e93;
      font-size: 14px;
    }
  </style>
</head>
<body>

    <p>장르별 명선 음악 & 테마 추천 서비스</p>
  </div>
  
  <!-- 통합 검색창 -->

  </div>

  <div class="music-list" id="results"></div>
</div>

window.onload = () => {
  renderList(musicData);
};

// 검색 기능 (제목, 아티스트, 앨범, 키워드, 카테고리명 모두 포함 검색)
function handleSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().replace(/\s+/g, '');
  
  if (!query) {
    document.getElementById('resultTitle').innerText = '추천 음악 목록';
    renderList(musicData);
    return;
  }

  const filtered = musicData.filter(item => {
    const fullContent = (
      item.title + 
      item.artist + 
      item.album + 
      item.categoryName + 
      item.description + 
      item.keywords
    ).toLowerCase().replace(/\s+/g, '');
    
    return fullContent.includes(query);
  });

  document.getElementById('resultTitle').innerText = `검색 결과 (${filtered.length}건)`;
  renderList(filtered);
}

// 카테고리 필터링
function filterCategory(categoryKey) {
  document.getElementById('searchInput').value = '';
  const filtered = musicData.filter(item => item.category === categoryKey);
  const catName = filtered.length > 0 ? filtered[0].categoryName : '카테고리';
  
  document.getElementById('resultTitle').innerText = `${catName} (${filtered.length}곡)`;
  renderList(filtered);
}

// UI 리스트 출력
function renderList(items) {
  const container = document.getElementById('results');
  
  if (items.length === 0) {
    container.innerHTML = '<div class="no-result">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>';
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="card">
      <div class="card-header">
        <div>
          <h3 class="card-title">${item.title}</h3>
          <div class="card-artist">${item.artist} — <i>${item.album}</i></div>
        </div>
        <span class="card-tag">${item.categoryName}</span>
      </div>
      <div class="card-desc">${item.description}</div>
      <div class="card-tracks">🎵 <b>앨범 연관 트랙:</b> ${item.trackList}</div>
    </div>
  `).join('');
}
